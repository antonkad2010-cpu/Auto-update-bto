name: Publish compatible script only
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-script
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check upstream and build
        id: check
        continue-on-error: true
        run: python tools/watch_game.py --once
      - name: Prepare only public output
        shell: bash
        run: |
          mkdir -p public-script
          if [ ! -f build/watch/status.json ]; then exit 1; fi
          state=$(python -c "import json; print(json.load(open('build/watch/status.json'))['status'])")
          case "$state" in
            verified_bindings) cp build/watch/game.modded.js public-script/game.modded.js ;;
            new_version_needs_remapping) printf '%s\n' 'Game version changed; a compatible script is not yet available.' > public-script/index.html ;;
            *) echo 'Version check failed; publication skipped.'; exit 1 ;;
          esac
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-script
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
