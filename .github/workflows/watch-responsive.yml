name: Check game version and build responsive script
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: watch-responsive
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build only a verified version
        run: python tools/watch_game.py --once
      - name: Upload status and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-game-check
          path: build/watch/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish only a compatible build to the stable path
        if: always()
        shell: bash
        run: |
          if [ ! -f build/watch/status.json ]; then exit 0; fi
          state=$(python -c "import json; print(json.load(open('build/watch/status.json'))['status'])")
          case "$state" in
            verified_bindings) mkdir -p dist; cp build/watch/game.modded.js dist/game.modded.js ;;
            new_version_needs_remapping) rm -f dist/game.modded.js ;;
            *) exit 0 ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- dist/game.modded.js
          if ! git diff --cached --quiet; then
            git commit -m "Update compatible game bundle"
            git push origin HEAD:main
          fi
