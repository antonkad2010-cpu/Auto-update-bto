name: Check game version and build responsive script
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: watch-responsive
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build only a verified version
        run: python tools/watch_game.py --once
      - name: Upload status and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-game-check
          path: build/watch/
          if-no-files-found: warn
          retention-days: 7
